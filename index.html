<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ቡታጀራ ገበያ</title>
    <!-- Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // ቡኒ (Brown) ብራንድ ቀለማት
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: { 50: '#fdf8f6', 100: '#f2e8e5', 500: '#a0522d', 600: '#8b4513', 900: '#4a2511' }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-brown-50 text-gray-800 pb-20">

    <!-- Header -->
    <header class="bg-brown-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-xl font-bold"><i class="fas fa-store mr-2"></i>ቡታጀራ ገበያ</h1>
        <div class="flex items-center space-x-2 text-sm">
            <span id="userName">እንግዳ</span>
            <div id="adminBadge" class="hidden bg-yellow-400 text-brown-900 text-xs font-bold px-2 py-0.5 rounded">ADMIN</div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="mainContent" class="p-4">
        <!-- ጃቫስክሪፕት እዚህ ጋር ይሞላል -->
    </main>

    <!-- Bottom Navigation (5 Tabs) -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around p-2 text-gray-500 text-[10px] sm:text-xs shadow-[0_-4px_15px_rgba(0,0,0,0.05)] z-50 pb-safe">
        <button onclick="switchTab('home')" id="tab-home" class="flex flex-col items-center w-1/5 text-brown-600"><i class="fas fa-home text-xl mb-1"></i>መነሻ</button>
        <button onclick="switchTab('shop')" id="tab-shop" class="flex flex-col items-center w-1/5"><i class="fas fa-shopping-bag text-xl mb-1"></i>ገበያ</button>
        <button onclick="switchTab('sell')" id="tab-sell" class="flex flex-col items-center w-1/5"><i class="fas fa-plus-circle text-xl mb-1"></i>መሸጫ</button>
        <button onclick="switchTab('favorites')" id="tab-favorites" class="flex flex-col items-center w-1/5"><i class="fas fa-heart text-xl mb-1"></i>ምርጫ</button>
        <button onclick="switchTab('profile')" id="tab-profile" class="flex flex-col items-center w-1/5"><i class="fas fa-user text-xl mb-1"></i>አካውንት</button>
    </nav>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // የ Butajera Gebeya Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBB3sL15IZxIGDW_aKVyiKsUMSaDrbtUfc",
            authDomain: "butajera-gebeya.firebaseapp.com",
            projectId: "butajera-gebeya",
            storageBucket: "butajera-gebeya.firebasestorage.app",
            messagingSenderId: "392404782992",
            appId: "1:392404782992:web:2b53ba913cba52ccc72d15",
            measurementId: "G-BN3VWE40K5"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ==========================================
        // የአድሚን እና ቦት መረጃዎች
        const ADMIN_IDS = [
            8356035160, // የአንተ ID
            7419922678  // የአጋዥህ ID
        ];
        const BOT_USERNAME = "butajera_gebeyabot"; // የቦቱ ዩዘርኔም
        // ==========================================

        const currentUser = tg.initDataUnsafe?.user || { id: 0, first_name: "እንግዳ" };
        const isAdmin = ADMIN_IDS.includes(currentUser.id);
        document.getElementById('userName').textContent = currentUser.first_name;
        if(isAdmin) document.getElementById('adminBadge').classList.remove('hidden');

        let productsCache = [];
        let favorites = JSON.parse(localStorage.getItem('butajera_favs') || '[]');

        window.switchTab = (tabName) => {
            document.querySelectorAll('nav button').forEach(btn => btn.className = 'flex flex-col items-center w-1/5 text-gray-500');
            document.getElementById(`tab-${tabName}`).className = 'flex flex-col items-center w-1/5 text-brown-600';
            const main = document.getElementById('mainContent');
            
            if(tabName === 'home') renderHome(main);
            if(tabName === 'shop') renderShop(main);
            if(tabName === 'favorites') renderFavorites(main);
            if(tabName === 'profile') renderProfile(main);
            
            // 🔒 Single Vendor Security Check
            if(tabName === 'sell') {
                if(!isAdmin) {
                    main.innerHTML = `<div class="text-center mt-24"><i class="fas fa-lock text-5xl text-red-400 mb-4"></i><h2 class="text-2xl font-bold text-gray-800">ይቅርታ!</h2><p class="text-gray-500 mt-2">ይህ ክፍል የተፈቀደው ለሱቁ ባለቤቶች ብቻ ነው።</p></div>`;
                } else {
                    renderSell(main);
                }
            }
        };

        // 📢 ቻናል ላክ (Admin Only)
        window.shareToChannel = (title, price, id) => {
            const text = `📦 እቃ: ${title}\n💰 ዋጋ: ${price} ብር\n\n🛒 ለማዘዝ ከታች ያለውን ሊንክ ይጫኑ👇`;
            const botLink = `https://t.me/${BOT_USERNAME}?start=order_${id}`;
            const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(botLink)}&text=${encodeURIComponent(text)}`;
            tg.openTelegramLink(shareUrl);
        };

        // ❤️ Like Function
        window.toggleFavorite = (id) => {
            const index = favorites.indexOf(id);
            if(index > -1) favorites.splice(index, 1);
            else favorites.push(id);
            localStorage.setItem('butajera_favs', JSON.stringify(favorites));
            switchTab('shop'); 
        };

        // ዳታቤዝ ማንበቢያ (በ ADMIN_IDS ብቻ Filter የተደረገ)
        async function fetchProducts() {
            if(productsCache.length > 0) return productsCache;
            const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
            const snapshot = await getDocs(q);
            productsCache = [];
            snapshot.forEach((doc) => {
                const data = doc.data();
                if (ADMIN_IDS.includes(data.sellerId)) {
                    productsCache.push({ id: doc.id, ...data });
                }
            });
            return productsCache;
        }

        // Product Card HTML ጄነሬተር
        function getProductCard(p) {
            const isFav = favorites.includes(p.id);
            return `
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col relative overflow-hidden">
                <img src="${p.image}" class="w-full h-36 object-cover" onclick="tg.showAlert('${p.description}')">
                <button onclick="toggleFavorite('${p.id}')" class="absolute top-2 right-2 bg-white/90 p-2 rounded-full shadow-sm ${isFav ? 'text-red-500' : 'text-gray-400'}">
                    <i class="fas fa-heart"></i>
                </button>
                <div class="p-3 flex flex-col flex-grow">
                    <h3 class="font-bold text-gray-800 text-sm mb-1 truncate">${p.name}</h3>
                    <p class="text-brown-600 font-bold mb-2">${p.price} ብር</p>
                    <div class="mt-auto space-y-2">
                        <button onclick="tg.openTelegramLink('https://t.me/${BOT_USERNAME}?start=order_${p.id}')" class="w-full bg-brown-600 text-white text-xs font-bold py-2 rounded-lg">
                            <i class="fas fa-shopping-cart mr-1"></i> እዘዝ
                        </button>
                        ${isAdmin ? `
                        <button onclick="shareToChannel('${p.name}', '${p.price}', '${p.id}')" class="w-full bg-blue-50 border border-blue-200 text-blue-700 text-xs font-bold py-2 rounded-lg">
                            <i class="fas fa-bullhorn mr-1"></i> ቻናል ላክ
                        </button>
                        ` : ''}
                    </div>
                </div>
            </div>`;
        }

        // 1. መነሻ ገጽ (Home)
        async function renderHome(main) {
            main.innerHTML = `<div class="text-center mt-10"><i class="fas fa-spinner fa-spin text-3xl text-brown-600"></i></div>`;
            const prods = await fetchProducts();
            const latest = prods.slice(0, 4).map(getProductCard).join('');
            
            main.innerHTML = `
                <div class="bg-brown-600 text-white rounded-2xl p-6 text-center shadow-lg mb-6 relative overflow-hidden">
                    <div class="absolute -right-4 -top-4 opacity-20"><i class="fas fa-shopping-bag text-8xl"></i></div>
                    <h2 class="text-2xl font-bold mb-2 relative z-10">ቡታጀራ ገበያ</h2>
                    <p class="text-brown-100 text-sm relative z-10">የሚፈልጉትን እቃ በአንድ ቦታ!</p>
                </div>
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-lg text-brown-900">አዳዲስ እቃዎች</h3>
                    <button onclick="switchTab('shop')" class="text-brown-600 text-sm font-bold">ሁሉንም እይ <i class="fas fa-angle-right"></i></button>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-6">${latest || '<p class="col-span-2 text-center text-gray-500">ምንም እቃ የለም</p>'}</div>
            `;
        }

        // 2. ገበያ (Shop)
        async function renderShop(main) {
            main.innerHTML = `<div class="text-center mt-10"><i class="fas fa-spinner fa-spin text-3xl text-brown-600"></i></div>`;
            const prods = await fetchProducts();
            const allItems = prods.map(getProductCard).join('');
            
            main.innerHTML = `
                <div class="relative mb-4">
                    <input type="text" id="searchInput" placeholder="እቃ ይፈልጉ..." class="w-full bg-white border border-gray-200 rounded-xl py-3 px-4 pl-10 focus:ring-2 focus:ring-brown-500 outline-none">
                    <i class="fas fa-search absolute left-4 top-3.5 text-gray-400"></i>
                </div>
                <div class="grid grid-cols-2 gap-3" id="shopGrid">${allItems || '<p class="col-span-2 text-center text-gray-500">ሱቁ ባዶ ነው</p>'}</div>
            `;
            
            // Search filter logic
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = prods.filter(p => p.name.toLowerCase().includes(term));
                document.getElementById('shopGrid').innerHTML = filtered.map(getProductCard).join('') || '<p class="col-span-2 text-center text-gray-500">የተፈለገው እቃ አልተገኘም</p>';
            });
        }

        // 3. መሸጫ (Sell - Admin Only)
        function renderSell(main) {
            main.innerHTML = `
                <h2 class="text-xl font-bold text-brown-900 mb-4"><i class="fas fa-plus-circle mr-2"></i>አዲስ እቃ አስገባ</h2>
                <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 space-y-4">
                    <div><label class="text-xs text-gray-500">የእቃው ስም</label><input type="text" id="sName" class="w-full border rounded-lg p-3 bg-gray-50"></div>
                    <div><label class="text-xs text-gray-500">ዋጋ (በብር)</label><input type="number" id="sPrice" class="w-full border rounded-lg p-3 bg-gray-50"></div>
                    <div><label class="text-xs text-gray-500">የፎቶ ሊንክ (URL)</label><input type="text" id="sImg" class="w-full border rounded-lg p-3 bg-gray-50"></div>
                    <div><label class="text-xs text-gray-500">መግለጫ</label><textarea id="sDesc" class="w-full border rounded-lg p-3 bg-gray-50 h-20"></textarea></div>
                    <button onclick="postItem()" class="w-full bg-brown-600 text-white font-bold py-3 rounded-lg"><i class="fas fa-upload mr-2"></i> ፖስት አድርግ</button>
                </div>
            `;
        }

        window.postItem = async () => {
            const name = document.getElementById('sName').value;
            const price = document.getElementById('sPrice').value;
            const img = document.getElementById('sImg').value || 'https://via.placeholder.com/300';
            const desc = document.getElementById('sDesc').value;

            if(!name || !price) return tg.showAlert("ስም እና ዋጋ ማስገባት ግዴታ ነው!");
            
            tg.MainButton.text = "እየተጫነ ነው..."; tg.MainButton.show();
            try {
                await addDoc(collection(db, "products"), {
                    name, price: Number(price), image: img, description: desc,
                    sellerId: currentUser.id, likes: 0, createdAt: new Date()
                });
                tg.MainButton.hide();
                tg.showAlert("በተሳካ ሁኔታ ተለጥፏል!");
                productsCache = []; // Reset cache
                switchTab('home');
            } catch(e) { tg.MainButton.hide(); tg.showAlert("ስህተት ተፈጥሯል!"); }
        };

        // 4. ምርጫ (Favorites)
        async function renderFavorites(main) {
            main.innerHTML = `<div class="text-center mt-10"><i class="fas fa-spinner fa-spin text-3xl text-brown-600"></i></div>`;
            const prods = await fetchProducts();
            const favItems = prods.filter(p => favorites.includes(p.id));
            
            main.innerHTML = `
                <h2 class="text-xl font-bold text-brown-900 mb-4"><i class="fas fa-heart text-red-500 mr-2"></i>የወደድኳቸው</h2>
                <div class="grid grid-cols-2 gap-3">
                    ${favItems.length ? favItems.map(getProductCard).join('') : '<div class="col-span-2 text-center py-10 bg-white rounded-xl"><i class="fas fa-box-open text-4xl text-gray-300 mb-2"></i><p class="text-gray-500">ምንም የለም</p></div>'}
                </div>
            `;
        }

        // 5. አካውንት (Profile / Admin Orders view)
        function renderProfile(main) {
            main.innerHTML = `
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 text-center mb-6">
                    <div class="w-20 h-20 bg-brown-100 rounded-full flex items-center justify-center mx-auto mb-3">
                        <i class="fas fa-user text-3xl text-brown-600"></i>
                    </div>
                    <h2 class="font-bold text-xl">${currentUser.first_name}</h2>
                    <p class="text-gray-500 text-sm mb-2">ID: ${currentUser.id}</p>
                    ${isAdmin ? `<span class="bg-yellow-400 text-brown-900 text-xs font-bold px-3 py-1 rounded-full">ሱቅ አስተዳዳሪ</span>` : `<span class="bg-gray-200 text-gray-600 text-xs px-3 py-1 rounded-full">ደንበኛ</span>`}
                </div>
                ${isAdmin ? `
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                        <p class="text-gray-500 text-xs mb-1">የእኛ እቃዎች</p>
                        <p class="text-2xl font-bold text-brown-600">${productsCache.length}</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                        <p class="text-gray-500 text-xs mb-1">እይታዎች</p>
                        <p class="text-2xl font-bold text-brown-600"><i class="fas fa-chart-line"></i></p>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                    <h3 class="font-bold text-gray-800 mb-3 border-b pb-2">የገቡ ትዕዛዞች</h3>
                    <p class="text-sm text-gray-500 text-center py-4">ትዕዛዞች በቀጥታ ወደ ቦትዎ በ Message ይላካሉ!</p>
                </div>
                ` : `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                    <h3 class="font-bold text-gray-800 mb-3 border-b pb-2">የእኔ ትዕዛዞች</h3>
                    <p class="text-sm text-gray-500 text-center py-4">እስካሁን ምንም ትዕዛዝ የለም</p>
                </div>
                `}
            `;
        }

        // የመጀመሪያ ገጽ
        switchTab('home');
    </script>
</body>
</html>
